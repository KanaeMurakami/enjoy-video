name: Update Tech PR Title

on:
  pull_request:
    types: [review_requested]

jobs:
  update-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: read
    steps:
      - name: Check and update PR title for tech label
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const currentTitle = pr.title;

            // すでに `tech` で始まっている場合はスキップ
            if (currentTitle.startsWith('`tech` ')) {
              console.log('PR title already starts with "`tech`"');
              return;
            }

            let hasTechLabel = false;

            // 1. PRにtechラベルが付いているかチェック
            const prLabels = pr.labels.map(label => label.name);
            if (prLabels.includes('tech')) {
              hasTechLabel = true;
              console.log('PR has tech label');
            }

            // 2. 紐づいているIssueにtechラベルが付いているかチェック（GraphQL API使用）
            if (!hasTechLabel) {
              const query = `
                query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      closingIssuesReferences(first: 10) {
                        nodes {
                          number
                          labels(first: 10) {
                            nodes {
                              name
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `;

              try {
                const result = await github.graphql(query, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  number: prNumber
                });

                const linkedIssues = result.repository.pullRequest.closingIssuesReferences.nodes;
                for (const issue of linkedIssues) {
                  const issueLabels = issue.labels.nodes.map(label => label.name);
                  if (issueLabels.includes('tech')) {
                    hasTechLabel = true;
                    console.log(`Linked issue #${issue.number} has tech label`);
                    break;
                  }
                }
              } catch (error) {
                console.log(`Could not fetch linked issues: ${error.message}`);
              }
            }

            // techラベルがある場合、PRタイトルを更新
            if (hasTechLabel) {
              const newTitle = '`tech` ' + currentTitle;
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                title: newTitle
              });
              console.log(`Updated PR title to: ${newTitle}`);
            } else {
              console.log('No tech label found on PR or linked issues');
            }
